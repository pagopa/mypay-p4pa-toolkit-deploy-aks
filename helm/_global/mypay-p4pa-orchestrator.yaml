microservice-chart:
  namespace: "migration-toolkit"
  nameOverride: ""
  fullnameOverride: ""

  startupProbe:
    create: true
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 30
    failureThreshold: 15
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    failureThreshold: 15
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 5
    failureThreshold: 15
    periodSeconds: 10

  deployment:
    create: true

  service:
    create: true
    type: ClusterIP
    port: 8080

  ingress:
    create: true
    path: /mypayp4paorchestrator/(.*)

  serviceAccount:
    create: false
    annotations: {}
    name: ""

  podAnnotations: {}

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534

  # externalConfigMapFiles:
  #   create: true
  #   configMaps:
  #     - name: appinsights-config
  #       key: applicationinsights.json

  envConfig:
    SERVER_PORT: "8080"

    LOG_LEVEL_ROOT: "INFO"
    LOG_LEVEL_PAGOPA: "INFO"
    LOG_LEVEL_SPRING: "INFO"
    LOG_LEVEL_SPRING_BOOT_AVAILABILITY: "DEBUG"
    LOGGING_LEVEL_API_REQUEST_EXCEPTION: "INFO"
    LOG_LEVEL_PERFORMANCE_LOG: "INFO"
    LOG_LEVEL_PERFORMANCE_LOG_API_REQUEST: "INFO"
    LOG_LEVEL_PERFORMANCE_LOG_REST_INVOKE: "INFO"

    DEFAULT_REST_CONNECTION_POOL_SIZE: "10"
    DEFAULT_REST_CONNECTION_POOL_SIZE_PER_ROUTE: "5"
    DEFAULT_REST_CONNECTION_POOL_TIME_TO_LIVE_MINUTES: "10"
    DEFAULT_REST_TIMEOUT_CONNECT_MILLIS: "120000"
    DEFAULT_REST_TIMEOUT_READ_MILLIS: "120000"

    EXTRACTOR_MAX_ATTEMPTS: "3"
    EXTRACTOR_WAIT_TIME_MILLIS: "500"
    EXTRACTOR_PRINT_BODY_WHEN_ERROR: "true"

    PU_AUTH_BASE_URL: "${PU_BASE_URL}/pu/auth"
    PU_AUTH_MAX_ATTEMPTS: "3"
    PU_AUTH_WAIT_TIME_MILLIS: "500"
    PU_AUTH_PRINT_BODY_WHEN_ERROR: "true"
    PU_MIGRATION_BASE_URL: "${PU_BASE_URL}/pu/migration"
    PU_MIGRATION_MAX_ATTEMPTS: "3"
    PU_MIGRATION_WAIT_TIME_MILLIS: "500"
    PU_MIGRATION_PRINT_BODY_WHEN_ERROR: "true"

    ASYNC_CORE_POOL_SIZE: "4"
    ASYNC_MAX_POOL_SIZE: "8"
    ASYNC_QUEUE_CAPACITY: "100"

    STORAGE_PATH_EXTRACTOR_OUTPUT: ""
    TMP_FOLDER: ""
    FILE_ENCRYPT_ENABLED: ""
    FILE_ENCRYPT_PSW: ""

    APPLICATIONINSIGHTS_ROLE_NAME: "mypay-p4pa-orchestrator"
    APPLICATIONINSIGHTS_INSTRUMENTATION_LOGGING_LEVEL: "OFF"
    APPLICATIONINSIGHTS_INSTRUMENTATION_MICROMETER_ENABLED: "false"
    APPLICATIONINSIGHTS_PREVIEW_PROFILER_ENABLED: "false"
    ENABLE_AUDIT_APPENDER: "TRUE"

    EXTRACTOR_BASE_URL: "http://mypay-p4pa-extractor-microservice-chart:8080"

  envSecret:
    # APPLICATIONINSIGHTS_CONNECTION_STRING: appinsights-connection-string

    CLIENT_ID: mypay-p4pa-toolkit-client-id
    CLIENT_SECRET: mypay-p4pa-toolkit-client-secret

    PU_AUTH_CLIENT_ID: mypay-p4pa-toolkit-pu-auth-client-id
    PU_AUTH_CLIENT_SECRET: mypay-p4pa-toolkit-pu-auth-client-secret

    ORCHESTRATOR_DB_NAME: "orchestrator_migration_toolkit"

    ORCHESTRATOR_DB_HOST: db-host
    ORCHESTRATOR_DB_USER: db-migration-toolkit-write-login-username
    ORCHESTRATOR_DB_PASSWORD: db-migration-toolkit-write-login-password

  # nodeSelector: {}

  tolerations:
    - key: "puOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: domain
                operator: In
                values:
                  - pu

microservice-chart:
  namespace: "migration-toolkit"
  nameOverride: ""
  fullnameOverride: ""

  startupProbe:
    create: true
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 30
    failureThreshold: 15
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    failureThreshold: 15
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 5
    failureThreshold: 15
    periodSeconds: 10

  deployment:
    create: true

  service:
    create: true
    type: ClusterIP
    port: 8080

  ingress:
    create: true
    path: /mypayp4paorchestrator/(.*)

  serviceAccount:
    create: false
    annotations: {}
    name: ""

  podAnnotations: {}

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534

  persistentVolumeClaimsMounts:
    create: true
    mounts:
      - name: share
        pvcName: mypay-p4pa-migration-toolkit-fileshare-pvc
        mountPath: "/shared"

  # externalConfigMapFiles:
  #   create: true
  #   configMaps:
  #     - name: appinsights-config
  #       key: applicationinsights.json

  envConfig:
    APPLICATIONINSIGHTS_ROLE_NAME: "mypay-p4pa-orchestrator"
    APPLICATIONINSIGHTS_INSTRUMENTATION_LOGGING_LEVEL: "OFF"
    APPLICATIONINSIGHTS_INSTRUMENTATION_MICROMETER_ENABLED: "false"
    APPLICATIONINSIGHTS_PREVIEW_PROFILER_ENABLED: "false"
    ENABLE_AUDIT_APPENDER: "TRUE"

    EXTRACTOR_BASE_URL: "http://mypay-p4pa-extractor-microservice-chart:8080"

    ORCHESTRATOR_DB_NAME: "orchestrator_migration_toolkit"

    ORCHESTRATOR_DB_HOST: "testPropReading"

  envSecret:
    # APPLICATIONINSIGHTS_CONNECTION_STRING: appinsights-connection-string

    CLIENT_ID: mypay-p4pa-toolkit-client-id
    CLIENT_SECRET: mypay-p4pa-toolkit-client-secret

    PU_AUTH_CLIENT_ID: mypay-p4pa-toolkit-pu-auth-client-id
    PU_AUTH_CLIENT_SECRET: mypay-p4pa-toolkit-pu-auth-client-secret

#    ORCHESTRATOR_DB_HOST: db-host
    ORCHESTRATOR_DB_USER: db-migration-toolkit-write-login-username
    ORCHESTRATOR_DB_PASSWORD: db-migration-toolkit-write-login-password

  # nodeSelector: {}

  tolerations:
    - key: "puOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: domain
                operator: In
                values:
                  - pu
